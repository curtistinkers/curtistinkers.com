$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Text
group: Base
props:
  type: object
  required:
    - text_color
    - text_size
  properties:
    text:
      type: string
      title: Rich text
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Tristique pretium pellentesque semper enim aliquam.</p>
    text_size:
      type: string
      title: Text size
      enum:
        - text-xs
        - text-sm
        - normal
        - text-lg
        - text-xl
        - text-2xl
        - text-3xl
      meta:enum:
        text-xs: 12px
        text-sm: 14px
        normal: 16px (default)
        text-lg: 18px
        text-xl: 20px
        text-2xl: 24px
        text-3xl: 32px
      examples:
        - normal
    text_color:
      type: string
      title: Text color
      enum:
        - default
        - inverted
        - primary
        - primary-inverted
        - secondary
        - secondary-inverted
        - accent
        - accent-inverted
        - muted
        - muted-inverted
        - destructive
        - destructive-inverted
      meta:enum:
        default: Default
        inverted: Inverted
        primary: Primary
        primary-inverted: Primary inverted
        secondary: Secondary
        secondary-inverted: Secondary inverted
        accent: Accent
        accent-inverted: Accent inverted
        muted: Muted
        muted-inverted: Muted inverted
        destructive: Destructive
        destructive-inverted: Destructive inverted
      examples:
        - default
    text_font_type:
      type: string
      title: Font style
      enum:
        - sans
        - serif
        - mono
      meta:enum:
        sans: Sans-serif font
        serif: Serif font
        mono: Monospace font
      examples:
        - sans
