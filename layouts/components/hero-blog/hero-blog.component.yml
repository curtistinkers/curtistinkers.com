"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Hero blog
description: Hero with side by side slots for media and content.
group: Hero
props:
  type: object
  properties:
    heading_text:
      type: string
      title: Heading
      default: "Enter the title"
      examples:
        - "Vivamus curae metus neque mollis orci ipsum sapien velit cursus"

    heading_level:
      type: integer
      title: Heading level
      enum: [1, 2, 3, 4, 5, 6]
      examples:
        - 1

    heading_font_type:
      type: string
      title: Heading font style
      enum:
        - sans
        - serif
        - mono
      meta:enum:
        sans: Sans-serif font
        serif: Serif font
        mono: Monospace font
      examples:
        - sans

    heading_color:
      type: string
      title: Heading color
      enum:
        - default
        - inverted
        - primary
      meta:enum:
        default: Default text
        inverted: Inverted text
        primary: Primary
      examples:
        - default

    heading_align:
      type: string
      title: Heading alignment
      enum:
        - left
        - center
        - right
      meta:enum:
        left: Left
        center: Center
        right: Right
      examples:
        - left

    date:
      type: integer
      title: Published Date
      # 2026-02-12
      default: 1770856866
      examples:
        - 1770856866

    author:
      type: string
      title: Author
      examples:
        - "John Smith"

    author_url:
      type: string
      title: Author link
      default: ""
      examples: []

    date_format:
      type: string
      title: Date format
      enum:
        - short
        - medium
        - long
      meta:enum:
        short: Short
        medium: Medium
        long: Long
      examples:
        - long

    text_font_type:
      type: string
      title: Font style
      enum:
        - sans
        - serif
        - mono
      meta:enum:
        sans: Sans-serif font
        serif: Serif font
        mono: Monospace font
      examples:
        - sans

    display_submitted:
      type: boolean
      title: Display author and publication time
      examples:
        - true

    media:
      $ref: json-schema-definitions://canvas.module/image
      title: Image
      type: object
      examples:
        - src: "assets/boliviainteligente-I1rJ9ViO3ik-unsplash.jpg"
          alt: "Placeholder image"
slots:
  blog_media:
    title: "Place Image"
