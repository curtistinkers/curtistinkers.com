"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Blog card
group: Card
props:
  type: object
  required:
    - heading_text
    - heading_level
    - heading_color
    - heading_size
  properties:
    background:
      type: string
      title: Background
      enum:
        - default
        - inverted
        - primary
        - primary-inverted
        - secondary
        - secondary-inverted
        - accent
        - accent-inverted
        - muted
        - muted-inverted
        - destructive
        - destructive-inverted
      meta:enum:
        default: Default
        inverted: Inverted
        primary: Primary
        primary-inverted: Primary inverted
        secondary: Secondary
        secondary-inverted: Secondary inverted
        accent: Accent
        accent-inverted: Accent inverted
        muted: Muted
        muted-inverted: Muted inverted
        destructive: Destructive
        destructive-inverted: Destructive inverted
      examples:
        - secondary-inverted

    style:
      type: string
      title: Style
      enum:
        - framed
        - full
      meta:enum:
        framed: Framed
        full: Full width
      examples:
        - framed

    orientation:
      type: string
      title: Orientation
      enum:
        - vertical
        - horizontal
      meta:enum:
        vertical: Vertical
        horizontal: Horizontal
      examples:
        - vertical

    heading_text:
      type: string
      title: Heading
      default: "Enter title"
      examples:
        - Your heading goes here

    heading_level:
      type: number
      title: Heading level
      enum: [1, 2, 3, 4, 5, 6]
      examples:
        - 2

    heading_size:
      type: string
      title: Heading size
      enum:
        - default
        - heading-responsive-8xl
        - heading-responsive-7xl
        - heading-responsive-6xl
        - heading-responsive-5xl
        - heading-responsive-4xl
        - heading-responsive-3xl
        - heading-responsive-2xl
        - heading-responsive-xl
      meta:enum:
        default: Default size
        heading-responsive-8xl: 8XL
        heading-responsive-7xl: 7XL
        heading-responsive-6xl: 6XL
        heading-responsive-5xl: 5XL
        heading-responsive-4xl: 4XL
        heading-responsive-3xl: 3XL
        heading-responsive-2xl: 2XL
        heading-responsive-xl: XL
      examples:
        - heading-responsive-4xl

    text_color:
      type: string
      title: Text color
      enum:
        - default
        - inverted
        - primary
        - primary-inverted
        - secondary
        - secondary-inverted
        - accent
        - accent-inverted
        - muted
        - muted-inverted
        - destructive
        - destructive-inverted
      meta:enum:
        default: Default
        inverted: Inverted
        primary: Primary
        primary-inverted: Primary inverted
        secondary: Secondary
        secondary-inverted: Secondary inverted
        accent: Accent
        accent-inverted: Accent inverted
        muted: Muted
        muted-inverted: Muted inverted
        destructive: Destructive
        destructive-inverted: Destructive inverted
      examples:
        - default

    url:
      type: string
      title: Link

    date:
      type: integer
      title: Published Date
      # 2026-02-12
      default: 1770856866
      examples:
        - 1770856866

    date_format:
      type: string
      title: Date format
      # 18 January 2026
      default: "j F Y"
      examples:
        - "j F Y"
        - "m/d/Y"
        - "Y-m-d"
        - 'l, F jS, Y \@ g:i A'

    author:
      type: string
      title: Author
      examples:
        - "John Smith"

    media:
      $ref: json-schema-definitions://canvas.module/image
      title: Image
      type: object
      examples:
        - src: "assets/jj-ying-8bghKxNU1j0-unsplash.jpg"
          width: 1200
          height: 900
          alt: "Photo by jjying: https://unsplash.com/photos/purple-and-blue-light-digital-wallpaper-8bghKxNU1j0"

    text:
      type: string
      title: Description
      pattern: "(.|\\r?\\n)*"
      examples:
        - "Quaerat laborum rerum dolores dolores dolor qui."

    is_text_centered:
      type: boolean
      title: Center text
      examples:
        - false
